name: iOS Build (unsigned)

on:
  push:
    paths-ignore:
      - '.github/workflows/android-build.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COCOAPODS_DISABLE_STATS: "true"
  KSPLAYER_REPOSITORY: "https://github.com/KleinerSource/KSPlayer.git"
  KSPLAYER_COMMIT: "c34287a220e629e5e796723ffa261d727dbcd7d4"
  FFMPEGKIT_REPOSITORY: "https://github.com/kingslay/FFmpegKit.git"
  FFMPEGKIT_VERSION: "6.1.4"
  DISPLAYCRITERIA_REPOSITORY: "https://github.com/KleinerSource/KSPlayer.git"
  DISPLAYCRITERIA_COMMIT: "c34287a220e629e5e796723ffa261d727dbcd7d4"
  LIBASS_REPOSITORY: "https://github.com/kingslay/FFmpegKit.git"
  LIBASS_VERSION: "6.1.4"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # master 与 dev 均按提交信息自动计算版本号，并由 iOS workflow
      # 持久化到当前分支，避免双平台同时写回产生竞争。
      # 新增/删除/增强功能: 次版本号 +1 且补丁号归零；优化/修复/改进: 补丁号 +1；构建始终只增加 build。
      - name: 计算并持久化构建版本号
        timeout-minutes: 2
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --format=%B "${GITHUB_SHA}")"
          version="$(dart tool/bump_app_version.dart --auto --commit-message "${commit_message}")"
          echo "构建版本: ${version}"
          if { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; } && \
             { [ "${GITHUB_REF}" = "refs/heads/master" ] || [ "${GITHUB_REF}" = "refs/heads/dev" ]; }; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore: bump build metadata to ${version} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 接受 Android SDK 许可证
        timeout-minutes: 3
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      # Bootstrap：本地无 SDK，没法跑 flutter create；首跑由 CI 补齐 ios/
      - name: Bootstrap ios/ if missing
        timeout-minutes: 5
        run: dart tool/prepare_native.dart bootstrap ios

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: 准备 ios 原生依赖配置
        timeout-minutes: 3
        run: dart tool/prepare_native.dart configure ios

      - name: pod install (CocoaPods fallback for media_kit)
        timeout-minutes: 12
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile (all-SPM); skip"
          fi

      # analyzer 崩溃排查：记录解析出的 analyzer 版本与 SDK 版本
      - name: 诊断 analyzer 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build ios (no codesign)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          build_args=(flutter build ios --release --no-codesign --no-pub)
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            build_args+=(--dart-define=BUILD_CHANNEL=dev)
          fi
          "${build_args[@]}"

      - name: 打包带版本号的 unsigned .ipa
        id: ios_artifact
        timeout-minutes: 3
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          artifact_prefix="omm"
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            artifact_prefix="omm_dev"
          fi
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          artifact_name="${artifact_prefix}_${version}.ipa"
          zip -qr "${artifact_name}" Payload
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "path=build/ios/iphoneos/${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: 验证 iOS IPA 不含 KleinerSource 相关信息
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ipa_path="${{ steps.ios_artifact.outputs.path }}"
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "${scan_dir}"' EXIT
          unzip -q "${ipa_path}" -d "${scan_dir}"
          if grep -R -a -q -i -E \
            'KleinerSource|KleinerSource@me\.com|github\.com/KleinerSource' \
            "${scan_dir}"; then
            echo "IPA 包含 KleinerSource 相关信息"
            exit 1
          fi

      - name: 上传 iOS Actions 产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/heads/dev') && 'omm_dev_' || 'omm_' }}${{ steps.ios_artifact.outputs.version }}.ipa
          path: ${{ steps.ios_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # master 与 dev 使用独立的滚动 Release，避免开发包覆盖正式 latest。
      - name: 发布到 GitHub Release (latest / latest-ios-dev)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            release_tag="latest-ios-dev"
            release_title="Latest unsigned iOS dev build"
            notes_title="未签名 iOS Dev 构建产物（自动滚动更新）"
          else
            release_tag="latest"
            release_title="Latest unsigned iOS build"
            notes_title="未签名 iOS 构建产物（自动滚动更新）"
          fi
          notes_file="$(mktemp)"
          trap 'rm -f "${notes_file}"' EXIT
          bash tool/generate_release_notes.sh \
            "${release_tag}" "${version}" "${notes_file}" "${notes_title}"
          gh release delete "${release_tag}" --yes --cleanup-tag || true
          gh release create "${release_tag}" "${{ steps.ios_artifact.outputs.path }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${release_title}" \
            --notes-file "${notes_file}"
