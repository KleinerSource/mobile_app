name: iOS Build (unsigned)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COCOAPODS_DISABLE_STATS: "true"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      # Bootstrap：本地无 SDK，没法跑 flutter create；首跑由 CI 补齐 ios/
      - name: Bootstrap ios/ if missing
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            echo "ios/ not found, scaffolding via flutter create"
            flutter create . \
              --no-pub \
              --platforms=ios \
              --org com.kleinersource.mdcenter \
              --project-name md_center \
              --description "md_center 移动端"
            # iOS deployment target 16.0
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '16.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '16.0'/" ios/Podfile || true
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" ios/Runner.xcodeproj/project.pbxproj || true
          else
            echo "ios/ exists, skipping bootstrap"
          fi
          # 删除 flutter create 生成的 counter 模板测试，避免 analyze 失败
          rm -f test/widget_test.dart

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      # analyzer 崩溃排查：记录解析出的 analyzer 版本与 SDK 版本
      - name: 诊断 analyzer 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build ios (no codesign)
        timeout-minutes: 25
        run: flutter build ios --release --no-codesign --no-pub

      - name: 打包 unsigned .ipa
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr md_center.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: md_center-ipa-unsigned
          path: build/ios/iphoneos/md_center.ipa
          retention-days: 14
