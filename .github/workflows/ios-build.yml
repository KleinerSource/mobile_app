name: iOS Build (unsigned)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COCOAPODS_DISABLE_STATS: "true"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      # Bootstrap：本地无 SDK，没法跑 flutter create；首跑由 CI 补齐 ios/
      - name: Bootstrap ios/ if missing
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "ios/Runner.xcodeproj not found, scaffolding via flutter create"
            flutter create . \
              --no-pub \
              --platforms=ios \
              --org com.kleinersource.mdcenter \
              --project-name md_center \
              --description "md_center 移动端"
            # iOS deployment target 16.0
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '16.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '16.0'/" ios/Podfile || true
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" ios/Runner.xcodeproj/project.pbxproj || true
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" ios/Runner.xcodeproj/project.pbxproj || true
          else
            echo "ios/Runner.xcodeproj exists, skipping bootstrap"
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          # 删除 flutter create 生成的 counter 模板测试，避免 analyze 失败
          rm -f test/widget_test.dart

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      # media_kit_libs_ios_video 仅 CocoaPods (无 SPM)，Flutter 3.44 自动回退生成
      # fallback Podfile。该 Podfile 在 pub get 阶段才生成，bootstrap 的 sed 对它无效，
      # 这里补修部署目标，再显式 pod install 兜底。
      # Plan B: 若 SPM/Pods 混合在 CI 报错，在 bootstrap 后加
      #   `flutter config --no-enable-swift-package-manager` 强制纯 CocoaPods。
      - name: 修正 fallback Podfile 部署目标
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios.*/platform :ios, '16.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/Podfile || true
            if ! grep -q "platform :ios" ios/Podfile; then
              printf "platform :ios, '16.0'\n%s\n" "$(cat ios/Podfile)" > ios/Podfile
            fi
            echo "---- ios/Podfile ----"; cat ios/Podfile
          else
            echo "No Podfile (all-SPM); skip"
          fi

      - name: pod install (CocoaPods fallback for media_kit)
        timeout-minutes: 12
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile (all-SPM); skip"
          fi

      # analyzer 崩溃排查：记录解析出的 analyzer 版本与 SDK 版本
      - name: 诊断 analyzer 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build ios (no codesign)
        timeout-minutes: 25
        run: flutter build ios --release --no-codesign --no-pub

      - name: 打包 unsigned .ipa
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr md_center.ipa Payload

      # 仅 master 分支 push 时滚动发布 latest 预发布
      - name: 发布到 GitHub Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="未签名 iOS 构建产物（自动滚动更新）

          - commit: ${GITHUB_SHA}
          - run: ${GITHUB_RUN_NUMBER}"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/ios/iphoneos/md_center.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest unsigned iOS build" \
            --notes "$notes"
