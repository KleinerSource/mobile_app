name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      # Bootstrap：本地无 SDK，没法跑 flutter create；首跑由 CI 补齐 android/
      - name: Bootstrap android/ if missing
        run: |
          if [ ! -d android ]; then
            echo "android/ not found, scaffolding via flutter create"
            flutter create . \
              --platforms=android \
              --org com.kleinersource.mdcenter \
              --project-name md_center \
              --description "md_center 移动端"
            # minSdk 24 / targetSdk 35 / compileSdk 35
            GRADLE_FILE=android/app/build.gradle.kts
            if [ -f "$GRADLE_FILE" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE_FILE"
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$GRADLE_FILE"
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$GRADLE_FILE"
            fi
          else
            echo "android/ exists, skipping bootstrap"
          fi

      - name: pub get
        run: flutter pub get

      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: build apk
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: md_center-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
