name: Android Build (unsigned)

on:
  push:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 递增应用版本号
        timeout-minutes: 2
        run: |
          set -euo pipefail
          version="$(dart tool/bump_app_version.dart)"
          echo "构建版本: ${version}"

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      - name: 安装 Android SDK 36
        timeout-minutes: 5
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      # 仓库只保留 Android 必要的源码文件，CI checkout 后补齐 Gradle 工程。
      - name: Bootstrap android/ if Gradle project is missing
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            echo "Android Gradle project is incomplete, scaffolding via flutter create"
            flutter create . \
              --no-pub \
              --platforms=android \
              --org com.kleinersource.mdcenter \
              --project-name md_center \
              --description "md_center 移动端"
          else
            echo "Android Gradle project exists, skipping bootstrap"
          fi

          for gradle_file in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "${gradle_file}" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "${gradle_file}" || true
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "${gradle_file}" || true
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "${gradle_file}" || true
            fi
          done

          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          rm -f test/widget_test.dart

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: 诊断 Flutter/Dart 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build android apk
        timeout-minutes: 25
        run: flutter build apk --release --split-per-abi --no-pub

      - name: 上传 Android Actions 产物
        uses: actions/upload-artifact@v6
        with:
          name: md_center-android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14

      # master push 单独发布 Android 最新预发布，不与 iOS latest Release 互相覆盖。
      - name: 发布到 GitHub Release (latest-android)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_subject="$(git show -s --format=%s "${GITHUB_SHA}")"
          commit_body="$(git show -s --format=%b "${GITHUB_SHA}")"
          if [ -z "${commit_body//[[:space:]]/}" ]; then
            commit_body="$(git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | sed 's/^/- /')"
          fi
          short_sha="${GITHUB_SHA:0:7}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          notes="$(printf '%s\n\n%s\n\ncommit: [%s](%s)\nrun: [%s](%s)' \
            '未签名 Android 构建产物（自动滚动更新）' \
            "$(printf '%s\n%s' "${commit_subject}" "${commit_body}")" \
            "${short_sha}" \
            "${commit_url}" \
            "${GITHUB_RUN_NUMBER}" \
            "${run_url}")"
          gh release delete latest-android --yes --cleanup-tag || true
          gh release create latest-android build/app/outputs/flutter-apk/app-*-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest unsigned Android build" \
            --notes "$notes"
