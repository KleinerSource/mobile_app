name: Android Build (unsigned)

on:
  push:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 计算构建版本号
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # 新增/删除/增强功能: 次版本号 +1 且补丁号归零；优化/修复/改进: 补丁号 +1；构建始终只增加 build。
          commit_message="$(git log -1 --format=%B "${GITHUB_SHA}")"
          version="$(dart tool/bump_app_version.dart --auto --commit-message "${commit_message}")"
          echo "构建版本: ${version}"

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      - name: 安装 Android SDK 36
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "${sdkmanager_bin}" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -n "${sdk_root}" ] && [ -d "${sdk_root}/cmdline-tools" ]; then
              sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
            fi
          fi
          if [ -z "${sdkmanager_bin}" ] || [ ! -f "${sdkmanager_bin}" ]; then
            echo "无法定位 Android SDK sdkmanager"
            exit 1
          fi
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" "platforms;android-36"

      # 仓库只保留 Android 必要的源码文件，CI checkout 后补齐 Gradle 工程。
      - name: Bootstrap android/ if Gradle project is missing
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            echo "Android Gradle project is incomplete, scaffolding via flutter create"
            flutter create . \
              --no-pub \
              --platforms=android \
              --org com.mdcenter \
              --project-name md_center \
              --description "md_center 移动端"
          else
            echo "Android Gradle project exists, skipping bootstrap"
          fi

          for gradle_file in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "${gradle_file}" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "${gradle_file}" || true
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "${gradle_file}" || true
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "${gradle_file}" || true
            fi
          done

          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          rm -f test/widget_test.dart

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: 修复 Gradle Wrapper 下载源
        timeout-minutes: 2
        run: |
          set -euo pipefail
          wrapper_properties="android/gradle/wrapper/gradle-wrapper.properties"
          test -f "${wrapper_properties}"
          # services.gradle.org 会重定向到发布资源,部分 runner 的 Java truststore
          # 无法验证该入口证书;官方 downloads 域名提供相同版本的直连下载。
          sed -i 's/services\.gradle\.org/downloads.gradle.org/g' "${wrapper_properties}"
          grep '^distributionUrl=' "${wrapper_properties}"

      - name: 修正 Android 音量插件 compileSdk
        timeout-minutes: 2
        run: |
          set -euo pipefail
          volume_controller_root_uri=""
          if command -v node >/dev/null 2>&1 && [ -f .dart_tool/package_config.json ]; then
            volume_controller_root_uri="$(node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('.dart_tool/package_config.json','utf8')); const pkg=config.packages.find(({name}) => name === 'flutter_volume_controller'); process.stdout.write(pkg?.rootUri ?? '');")"
          fi
          volume_controller_root="${volume_controller_root_uri#file://}"
          volume_controller_gradle=""
          if [ -n "${volume_controller_root}" ] && [ -d "${volume_controller_root}/android" ]; then
            volume_controller_gradle="$(find "${volume_controller_root}/android" -name 'build.gradle*' -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "${volume_controller_gradle}" ]; then
            pub_cache_root="${PUB_CACHE:-/home/runner/.pub-cache}"
            volume_controller_gradle="$(find "${pub_cache_root}" -path '*/flutter_volume_controller-*/android/build.gradle*' -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "${volume_controller_gradle}" ]; then
            echo "无法定位 flutter_volume_controller 的 Android Gradle 配置"
            exit 1
          fi
          sed -i -E \
            -e 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            -e 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' \
            "${volume_controller_gradle}"
          grep -nE 'compileSdk(Version)?' "${volume_controller_gradle}"

      - name: 诊断 Flutter/Dart 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build android apk
        timeout-minutes: 25
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: 验证 Android APK 仅包含 arm64
        timeout-minutes: 2
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "${apk_path}" | grep -q 'lib/arm64-v8a/'
          if unzip -l "${apk_path}" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK 仍包含非 arm64 原生库"
            exit 1
          fi

      - name: 添加版本号到 Android 产物
        id: android_artifact
        timeout-minutes: 2
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          artifact_path="build/app/outputs/flutter-apk/md_center_${version}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${artifact_path}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "path=${artifact_path}" >> "${GITHUB_OUTPUT}"

      - name: 上传 Android Actions 产物
        uses: actions/upload-artifact@v6
        with:
          name: md_center_${{ steps.android_artifact.outputs.version }}.apk
          path: ${{ steps.android_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # master push 单独发布 Android 最新预发布，不与 iOS latest Release 互相覆盖。
      - name: 发布到 GitHub Release (latest-android)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          notes_file="$(mktemp)"
          trap 'rm -f "${notes_file}"' EXIT
          bash tool/generate_release_notes.sh \
            latest-android "${version}" "${notes_file}"
          gh release delete latest-android --yes --cleanup-tag || true
          gh release create latest-android "${{ steps.android_artifact.outputs.path }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest unsigned Android build" \
            --notes-file "${notes_file}"
