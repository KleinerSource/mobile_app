name: Android Build

on:
  push:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: 计算构建版本号
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # 新增/删除/增强功能: 次版本号 +1 且补丁号归零；优化/修复/改进: 补丁号 +1；构建始终只增加 build。
          commit_message="$(git log -1 --format=%B "${GITHUB_SHA}")"
          version="$(dart tool/bump_app_version.dart --auto --commit-message "${commit_message}")"
          echo "构建版本: ${version}"

      - name: 接受 Android SDK 许可证
        timeout-minutes: 3
        run: |
          set +o pipefail
          yes | flutter doctor --android-licenses

      - name: Flutter doctor
        timeout-minutes: 3
        run: flutter doctor -v

      - name: 安装 Android SDK 36
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "${sdkmanager_bin}" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -n "${sdk_root}" ] && [ -d "${sdk_root}/cmdline-tools" ]; then
              sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
            fi
          fi
          if [ -z "${sdkmanager_bin}" ] || [ ! -f "${sdkmanager_bin}" ]; then
            echo "无法定位 Android SDK sdkmanager"
            exit 1
          fi
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" "platforms;android-36"

      # 仓库只保留 Android 必要的源码文件，CI checkout 后补齐 Gradle 工程。
      - name: Bootstrap android/ if Gradle project is missing
        timeout-minutes: 5
        run: dart tool/prepare_native.dart bootstrap android

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: 准备 android 原生依赖配置
        timeout-minutes: 3
        run: dart tool/prepare_native.dart configure android

      # Release APK 必须始终使用同一份证书，否则在线更新会被 Android
      # 安装器拒绝。请在仓库 Secrets 中配置以下四项：
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。
      # Pull Request 可能来自没有 Secrets 权限的 fork，继续使用本地 debug 回退，
      # 但这类 APK 不会发布到在线更新源。
      - name: 配置 Android 发布签名
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::缺少 GitHub Secret ${variable}，不能构建可在线更新的 Android APK"
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          printf '%s\n' \
            "storeFile=app/release.keystore" \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            > android/key.properties

      - name: 诊断 Flutter/Dart 版本
        timeout-minutes: 2
        run: |
          dart --version
          flutter --version
          grep -A6 '^  analyzer:' pubspec.lock | grep version || true
          grep -A6 '^  _fe_analyzer_shared:' pubspec.lock | grep version || true

      - name: build_runner
        timeout-minutes: 10
        run: dart run build_runner build

      - name: analyze
        timeout-minutes: 8
        run: flutter analyze

      - name: test
        timeout-minutes: 10
        run: flutter test

      - name: build android apk
        timeout-minutes: 25
        run: |
          set -euo pipefail
          build_args=(flutter build apk --release --target-platform android-arm64 --no-pub)
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            build_args+=(--dart-define=BUILD_CHANNEL=dev)
          fi
          "${build_args[@]}"

      - name: 验证 Android APK 仅包含 arm64
        timeout-minutes: 2
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          unzip -l "${apk_path}" | grep -q 'lib/arm64-v8a/'
          if unzip -l "${apk_path}" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK 仍包含非 arm64 原生库"
            exit 1
          fi

          scan_dir="$(mktemp -d)"
          trap 'rm -rf "${scan_dir}"' EXIT
          unzip -q "${apk_path}" -d "${scan_dir}"
          if grep -R -a -q -i -E \
            'KleinerSource|KleinerSource@me\.com|github\.com/KleinerSource' \
            "${scan_dir}"; then
            echo "APK 包含 KleinerSource 相关信息"
            exit 1
          fi

      - name: 添加版本号到 Android 产物
        id: android_artifact
        timeout-minutes: 2
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          artifact_prefix="omm"
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            artifact_prefix="omm_dev"
          fi
          artifact_path="build/app/outputs/flutter-apk/${artifact_prefix}_${version}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${artifact_path}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "path=${artifact_path}" >> "${GITHUB_OUTPUT}"

      - name: 上传 Android Actions 产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/heads/dev') && 'omm_dev_' || 'omm_' }}${{ steps.android_artifact.outputs.version }}.apk
          path: ${{ steps.android_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # master 与 dev 使用独立的滚动 Release，避免开发包覆盖正式 latest-android。
      - name: 发布到 GitHub Release (latest-android / latest-android-dev)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            release_tag="latest-android-dev"
            release_title="Latest Android dev build"
            notes_title="Android Dev 构建产物（自动滚动更新）"
          else
            release_tag="latest-android"
            release_title="Latest Android build"
            notes_title="Android 构建产物（自动滚动更新）"
          fi
          notes_file="$(mktemp)"
          trap 'rm -f "${notes_file}"' EXIT
          bash tool/generate_release_notes.sh \
            "${release_tag}" "${version}" "${notes_file}" "${notes_title}"
          gh release delete "${release_tag}" --yes --cleanup-tag || true
          gh release create "${release_tag}" "${{ steps.android_artifact.outputs.path }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${release_title}" \
            --notes-file "${notes_file}"
