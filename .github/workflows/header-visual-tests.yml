name: Header Visual Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        timeout-minutes: 10
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: Header golden tests
        timeout-minutes: 5
        run: flutter test --no-pub --dart-define=HEADER_GOLDENS=true test/shared/header_visual_test.dart --reporter expanded

      - name: upload visual differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: header-visual-differences
          path: test/shared/failures/
          if-no-files-found: ignore
          retention-days: 7
