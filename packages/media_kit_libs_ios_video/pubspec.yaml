name: media_kit_libs_ios_video
description: iOS native libraries for media_kit with full PGS subtitle decoding.
publish_to: none
version: 1.1.4

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MediaKitLibsIosVideoPlugin
