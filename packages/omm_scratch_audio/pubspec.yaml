name: omm_scratch_audio
description: Native PCM audio output for single-deck DJ scratching.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.ohmymedia.omm_scratch_audio
        pluginClass: OmmScratchAudioPlugin
      ios:
        pluginClass: OmmScratchAudioPlugin
