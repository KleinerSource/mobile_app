name: omm
description: omm 移动端 (iOS + Android)
publish_to: 'none'
version: 0.84.5+696
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.2
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  retrofit: ^4.9.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.3.0
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  sensors_plus: ^7.1.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video
  media_kit_libs_ios_video:
    path: packages/media_kit_libs_ios_video
  omm_ksplayer:
    path: packages/omm_ksplayer
  flutter_volume_controller: ^2.0.1
  wakelock_plus: ^1.4.0
  infinite_scroll_pagination: ^4.1.0
  lpinyin: ^2.0.3
  web_socket_channel: ^3.0.1
  dart_smb2: ^0.1.2
  webdav_client: ^1.2.2
  flutter_svg: ^2.3.0
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_metadata_reader: ^1.7.1
  omm_scratch_audio:
    path: packages/omm_scratch_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  pigeon: 26.3.4
  # 钉住稳定版：^3.0.0 的上界会匹配 3.x 的 prerelease，pub upgrade 会解析到
  # 3.2.6-dev.1。生成器版本变化直接影响 *.freezed.dart 产物，不接受 dev 版。
  freezed: 3.2.5
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.3

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/THIRD_PARTY_NOTICES.md
    - assets/branding/oh_my_media_logo.png
    - assets/audio_player/
    - assets/server_avatars/
    - assets/file_icons/
