name: md_center
description: md_center 移动端 (iOS + Android)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  retrofit: ^4.9.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  better_player_plus: ^1.0.8
  infinite_scroll_pagination: ^4.1.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true
