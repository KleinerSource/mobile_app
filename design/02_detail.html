<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>md_center · v6 · Movie Detail + Person Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    padding: 56px 32px; min-height: 100vh; color: #fff;
    background:
      radial-gradient(ellipse at 10% 10%, #4d3d5e 0%, transparent 40%),
      radial-gradient(ellipse at 90% 90%, #3d4d5e 0%, transparent 40%),
      #0d0d12;
  }
  .hdr { max-width: 1800px; margin: 0 auto 48px; }
  .hdr h1 { font-weight: 800; font-size: 30px; letter-spacing: -0.03em; margin: 0 0 10px; }
  .hdr .tag { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #aaa; font-weight: 700; }
  .hdr .desc { font-size: 14px; color: #c5c5d0; margin-top: 12px; max-width: 800px; line-height: 1.6; }
  .canvas { max-width: 1800px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .lbl { margin-bottom: 18px; text-align: left; width: 100%; max-width: 420px; }
  .lbl .pill { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .lbl .pill.light { background: #fff; color: #000; }
  .lbl .pill.dark { background: #1a1a22; color: #fff; border: 1px solid #2a2a35; }
  .lbl .name { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .lbl .desc { font-size: 11.5px; color: #b8b3c0; margin-top: 6px; line-height: 1.45; }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { scrollbar-width: none; }
  @media (max-width: 1600px) { .canvas { grid-template-columns: repeat(2, 1fr); gap: 56px; } }
  @media (max-width: 900px) { .canvas { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="hdr">
  <div class="tag">md_center · iOS · v6 · Movie Detail + Person Detail (Light + Dark)</div>
  <h1>影片详情 + 人物详情 · 双版本</h1>
  <div class="desc">
    Movie Detail: hero 海报取色 + 大字片名 + Play/+List + 主创 + 简介 + 元数据 + 文件信息。
    Person Detail: 大头像 + 国籍/生日/出生地 + 作品集网格 + 与本人合作过的导演/演员。
    全部 sans-serif,延续 v4/v5 的多彩 grammar。
  </div>
</div>

<div class="canvas" id="root"></div>

<script type="text/babel" data-presets="react">

// =============== IosFrame ===============
const ifs = {
  wrap: { display: 'inline-block', padding: 11, background: '#111', borderRadius: 56, boxShadow: '0 0 0 2px #2a2a35, 0 30px 80px rgba(0,0,0,0.6)', position: 'relative' },
  scr: { position: 'relative', borderRadius: 45, overflow: 'hidden' },
  sb: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, sans-serif', zIndex: 50, pointerEvents: 'none' },
  di: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 60 },
  si: { display: 'flex', alignItems: 'center', gap: 6 },
  bar: { width: 3, background: 'currentColor', borderRadius: 1 },
  bat: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.85 },
  cap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  ct: { position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, overflow: 'auto' },
  hi: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, borderRadius: 999, zIndex: 40 },
};
function IosFrame({ children, bg, textColor, homeBg }) {
  return (
    <div style={ifs.wrap}>
      <div style={{ ...ifs.scr, width: 393, height: 852, background: bg }}>
        <div style={{ ...ifs.sb, color: textColor }}>
          <span>9:41</span>
          <div style={ifs.si}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 }}>
              <div style={{ ...ifs.bar, height: 4 }} /><div style={{ ...ifs.bar, height: 6 }} />
              <div style={{ ...ifs.bar, height: 9 }} /><div style={{ ...ifs.bar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/>
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/>
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7"/>
            </svg>
            <div style={ifs.bat}>
              <div style={{ width: '82%', height: '100%', background: 'currentColor', borderRadius: 1 }}/>
              <div style={ifs.cap}/>
            </div>
          </div>
        </div>
        <div style={ifs.di}/>
        <div style={ifs.ct}>{children}</div>
        <div style={{ ...ifs.hi, background: homeBg }}/>
      </div>
    </div>
  );
}

// =============== Poster ===============
function Poster({ title, year, hue, w = '100%', aspect = '2/3', radius = 10 }) {
  const h = hue !== undefined ? hue : (((title || '').charCodeAt(0) * 7) % 360);
  return (
    <div style={{
      width: w, aspectRatio: aspect, borderRadius: radius, overflow: 'hidden',
      background: `linear-gradient(155deg, hsl(${h} 55% 40%) 0%, hsl(${h + 30} 65% 18%) 100%)`,
      position: 'relative', boxShadow: '0 6px 24px rgba(0,0,0,0.2)',
    }}>
      <div style={{
        position: 'absolute', inset: 0,
        background: `radial-gradient(circle at 28% 22%, hsla(${h} 80% 70% / 0.35), transparent 55%)`,
      }}/>
      <div style={{ position: 'absolute', left: '10%', right: '10%', bottom: '12%' }}>
        <div style={{ fontWeight: 800, fontSize: 11, color: 'rgba(255,255,255,0.96)', lineHeight: 1.15, textShadow: '0 1px 4px rgba(0,0,0,0.4)' }}>{title}</div>
        {year && <div style={{ fontSize: 9, marginTop: 3, color: 'rgba(255,255,255,0.65)', fontWeight: 600 }}>{year}</div>}
      </div>
    </div>
  );
}

// =============== Theme tokens (复用 v5) ===============
const LIGHT = {
  bg: '#FAF6F0', text: '#1a1a22', text2: '#3a3a45',
  muted: '#6e6e7a', muted2: '#9a96a8',
  accent: '#7C4DFF',
  cardBg: '#fff', cardBorder: '1px solid rgba(0,0,0,0.05)',
  cardShadow: '0 4px 18px rgba(60, 50, 80, 0.10)',
  cardShadowStrong: '0 8px 30px rgba(60, 50, 80, 0.16)',
  iconBg: '#fff', iconBorder: '1px solid rgba(0,0,0,0.08)',
  divider: 'rgba(0,0,0,0.06)',
  pillBg: 'rgba(0,0,0,0.05)', pillText: '#3a3a45',
};
const DARK = {
  bg: '#0F0E14', text: '#fff', text2: '#d8d4e0',
  muted: '#9a96a8', muted2: '#6e6a7a',
  accent: '#B888FF',
  cardBg: 'rgba(255,255,255,0.04)', cardBorder: '1px solid rgba(255,255,255,0.06)',
  cardShadow: '0 4px 18px rgba(0,0,0,0.3)',
  cardShadowStrong: '0 8px 30px rgba(0,0,0,0.4)',
  iconBg: 'rgba(255,255,255,0.08)', iconBorder: '1px solid rgba(255,255,255,0.1)',
  divider: 'rgba(255,255,255,0.06)',
  pillBg: 'rgba(255,255,255,0.08)', pillText: '#d8d4e0',
};

// =============== Back / overflow buttons ===============
function NavButton({ icon, theme: t }) {
  return (
    <div style={{
      width: 38, height: 38, borderRadius: '50%',
      background: t === LIGHT ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.45)',
      backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      border: '1px solid ' + (t === LIGHT ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.1)'),
    }}>{icon}</div>
  );
}

// =============== Movie Detail Screen ===============
const MOVIE = {
  title: 'Past Lives',
  tagline: 'In another life, would we have stayed?',
  year: 2023,
  director: 'Celine Song',
  runtime: 105,
  rating: 4.6,
  ratingCount: 218,
  country: 'USA · South Korea',
  language: 'English · Korean',
  resolution: '1080p · HDR',
  fileSize: '14.2 GB',
  filePath: '/library/movies/past-lives.2023.1080p.mkv',
  hue: 8,
  addedAt: '2024-11-08',
  watchedAt: null,
  watched: false,
  synopsis: 'Two childhood friends from Korea are reunited 20 years later in New York. Over one fateful week, they reckon with notions of love, destiny, and the choices that shape a life.',
  genres: [
    { name: 'Drama', hue: 270 },
    { name: 'Romance', hue: 320 },
  ],
  tags: ['Slow burn', 'Diaspora', 'A24', 'First feature', 'Sundance'],
  cast: [
    { name: 'Greta Lee', role: 'Nora', hue: 320 },
    { name: 'Teo Yoo', role: 'Hae Sung', hue: 200 },
    { name: 'John Magaro', role: 'Arthur', hue: 30 },
  ],
};

function MovieDetailScreen({ theme: t }) {
  return (
    <div style={{
      minHeight: '100%', background: t.bg, color: t.text,
      paddingBottom: 32, position: 'relative', overflow: 'hidden',
    }}>
      {/* Hero with backdrop wash */}
      <div style={{ position: 'relative', height: 480, marginBottom: -60 }}>
        {/* 海报取色背景 */}
        <div style={{
          position: 'absolute', inset: 0,
          background: `linear-gradient(155deg, hsl(${MOVIE.hue} 55% 35%) 0%, hsl(${MOVIE.hue + 30} 65% 16%) 100%)`,
        }}/>
        <div style={{
          position: 'absolute', inset: 0,
          background: `radial-gradient(ellipse at 30% 20%, hsla(${MOVIE.hue} 80% 60% / 0.45), transparent 60%)`,
        }}/>
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0, height: '60%',
          background: `linear-gradient(180deg, transparent, ${t.bg} 92%)`,
        }}/>

        {/* Top nav buttons */}
        <div style={{ position: 'absolute', top: 60, left: 0, right: 0, padding: '0 20px', display: 'flex', justifyContent: 'space-between', zIndex: 5 }}>
          <NavButton theme={t} icon={
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2 L4 7 L9 12" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          }/>
          <div style={{ display: 'flex', gap: 8 }}>
            <NavButton theme={t} icon={
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2 V12 M2.5 7 H12.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
            }/>
            <NavButton theme={t} icon={
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="2.5" r="1.3" fill="#fff"/><circle cx="7" cy="7" r="1.3" fill="#fff"/><circle cx="7" cy="11.5" r="1.3" fill="#fff"/></svg>
            }/>
          </div>
        </div>

        {/* Hero poster centered */}
        <div style={{
          position: 'absolute', top: 112, left: '50%', transform: 'translateX(-50%)',
          width: 170, zIndex: 3,
        }}>
          <Poster title="Past Lives" hue={MOVIE.hue} radius={14}/>
        </div>
      </div>

      {/* Title + meta */}
      <div style={{ padding: '0 24px 18px', position: 'relative', zIndex: 5, textAlign: 'center' }}>
        <div style={{
          fontWeight: 800, fontSize: 32, letterSpacing: '-0.03em',
          lineHeight: 1.05, marginBottom: 8,
        }}>{MOVIE.title}</div>
        <div style={{
          fontSize: 13.5, color: t.muted, fontWeight: 500,
          display: 'flex', gap: 8, justifyContent: 'center', alignItems: 'center', marginBottom: 14,
        }}>
          <span style={{ fontWeight: 600, color: t.text2 }}>{MOVIE.year}</span>
          <span style={{ opacity: 0.4 }}>·</span>
          <span>{MOVIE.runtime} min</span>
          <span style={{ opacity: 0.4 }}>·</span>
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 4, fontWeight: 700,
            color: t === LIGHT ? '#B8860B' : '#FFD600',
          }}>
            <svg width="11" height="11" viewBox="0 0 11 11"><polygon points="5.5,0.5 6.8,3.7 10.3,3.9 7.5,6.0 8.6,9.5 5.5,7.6 2.4,9.5 3.5,6.0 0.7,3.9 4.2,3.7" fill="currentColor"/></svg>
            {MOVIE.rating}
          </span>
        </div>

        {/* Genre/tag pills */}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', marginBottom: 18 }}>
          {MOVIE.genres.map((g, i) => (
            <div key={i} style={{
              padding: '5px 12px', borderRadius: 100,
              background: `hsla(${g.hue} 65% 55% / ${t === LIGHT ? '0.15' : '0.22'})`,
              border: `1.5px solid hsla(${g.hue} 70% 55% / 0.4)`,
              color: t === LIGHT ? `hsl(${g.hue} 70% 30%)` : `hsl(${g.hue} 85% 80%)`,
              fontWeight: 700, fontSize: 11.5,
            }}>{g.name}</div>
          ))}
          {MOVIE.tags.slice(0, 3).map((tag, i) => (
            <div key={i} style={{
              padding: '5px 12px', borderRadius: 100,
              background: t.pillBg, color: t.muted,
              fontWeight: 600, fontSize: 11.5,
            }}>{tag}</div>
          ))}
        </div>

        {/* Action */}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
          <button style={{
            background: t.text, color: t.bg, border: 'none', padding: '13px 32px',
            borderRadius: 100, fontWeight: 800, fontSize: 14, letterSpacing: '-0.01em',
            display: 'flex', alignItems: 'center', gap: 8,
            boxShadow: t.cardShadowStrong,
          }}>
            <svg width="10" height="12" viewBox="0 0 10 12" fill={t.bg}><polygon points="0,0 0,12 10,6"/></svg>
            Play
          </button>
          <button style={{
            background: t.cardBg, color: t.text, border: t.cardBorder,
            padding: '13px 18px', borderRadius: 100, fontWeight: 700, fontSize: 14,
            display: 'flex', alignItems: 'center', gap: 6,
          }}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5 V11.5 M1.5 6.5 H11.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
            Save
          </button>
          <button style={{
            background: t.cardBg, color: t.text, border: t.cardBorder,
            padding: '13px 16px', borderRadius: 100, fontWeight: 700, fontSize: 14,
          }}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9.5 1 L11.5 3 L4.5 10 L1.5 11 L2.5 8 Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>
          </button>
        </div>
      </div>

      {/* Tagline */}
      <div style={{
        padding: '20px 28px 8px', textAlign: 'center',
        color: t.muted, fontSize: 13.5, fontWeight: 500, fontStyle: 'italic', lineHeight: 1.4,
      }}>
        "{MOVIE.tagline}"
      </div>

      {/* Synopsis */}
      <div style={{ padding: '12px 24px 26px' }}>
        <div style={{
          fontSize: 14.5, color: t.text2, fontWeight: 500, lineHeight: 1.55,
        }}>{MOVIE.synopsis}</div>
        <div style={{
          marginTop: 8, fontSize: 12.5, color: t.accent, fontWeight: 700,
        }}>Read more</div>
      </div>

      {/* Cast */}
      <div style={{ padding: '0 24px 12px', display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div style={{ fontWeight: 800, fontSize: 18, letterSpacing: '-0.025em' }}>Cast & crew</div>
        <div style={{ fontSize: 12, color: t.accent, fontWeight: 700 }}>See all</div>
      </div>
      <div className="scroll-hide" style={{ display: 'flex', gap: 14, overflowX: 'auto', padding: '0 24px 28px' }}>
        {[
          { name: MOVIE.director, role: 'Director', hue: 280 },
          ...MOVIE.cast,
        ].map((p, i) => (
          <div key={i} style={{ flex: '0 0 76px', textAlign: 'center' }}>
            <div style={{
              width: 76, height: 76, borderRadius: '50%',
              background: `linear-gradient(135deg, hsl(${p.hue} 65% 50%), hsl(${p.hue + 30} 75% 28%))`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontWeight: 800, fontSize: 22, color: '#fff',
              boxShadow: `0 4px 14px hsla(${p.hue} 70% 50% / 0.3)`,
            }}>{p.name.split(' ').map(w => w[0]).join('').slice(0, 2)}</div>
            <div style={{ marginTop: 8, fontWeight: 700, fontSize: 12, lineHeight: 1.2 }}>{p.name}</div>
            <div style={{ marginTop: 2, fontSize: 10, color: t.muted, fontWeight: 600, lineHeight: 1.2 }}>{p.role}</div>
          </div>
        ))}
      </div>

      {/* All tags chip cloud */}
      <div style={{ padding: '0 24px 24px' }}>
        <div style={{ fontWeight: 800, fontSize: 18, letterSpacing: '-0.025em', marginBottom: 12 }}>Tags</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {MOVIE.tags.map((tag, i) => (
            <div key={i} style={{
              padding: '6px 12px', borderRadius: 8,
              background: t.cardBg, border: t.cardBorder,
              color: t.text2, fontWeight: 600, fontSize: 12,
            }}>{tag}</div>
          ))}
        </div>
      </div>

      {/* File / technical */}
      <div style={{ padding: '0 24px 32px' }}>
        <div style={{ fontWeight: 800, fontSize: 18, letterSpacing: '-0.025em', marginBottom: 12 }}>File info</div>
        <div style={{
          background: t.cardBg, border: t.cardBorder, borderRadius: 16,
          overflow: 'hidden',
        }}>
          {[
            ['Resolution', MOVIE.resolution],
            ['Size', MOVIE.fileSize],
            ['Country', MOVIE.country],
            ['Language', MOVIE.language],
            ['Added', MOVIE.addedAt],
          ].map(([k, v], i, arr) => (
            <div key={i} style={{
              display: 'flex', padding: '12px 16px',
              borderBottom: i < arr.length - 1 ? `1px solid ${t.divider}` : 'none',
              alignItems: 'center',
            }}>
              <div style={{
                flex: '0 0 110px', fontSize: 12, fontWeight: 700,
                color: t.muted, letterSpacing: '0.02em',
              }}>{k}</div>
              <div style={{ flex: 1, fontSize: 13, fontWeight: 600, color: t.text }}>{v}</div>
            </div>
          ))}
          <div style={{
            padding: '12px 16px', background: t === LIGHT ? 'rgba(0,0,0,0.02)' : 'rgba(255,255,255,0.02)',
            borderTop: `1px solid ${t.divider}`,
          }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: t.muted, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 4 }}>Path</div>
            <div style={{
              fontSize: 11, fontFamily: 'ui-monospace, SF Mono, monospace',
              color: t.text2, wordBreak: 'break-all', lineHeight: 1.5,
            }}>{MOVIE.filePath}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// =============== Person Detail Screen ===============
const PERSON = {
  name: 'Hirokazu Kore-eda',
  role: 'Director · Screenwriter',
  born: '1962-06-06',
  birthplace: 'Tokyo, Japan',
  films: 14,
  hue: 145,
  bio: 'Japanese filmmaker known for his quiet, observational dramas exploring family, memory and loss. His film Shoplifters won the Palme d\'Or at Cannes in 2018.',
  filmography: [
    { title: 'Monster', year: 2023, hue: 145 },
    { title: 'Broker', year: 2022, hue: 195 },
    { title: 'The Truth', year: 2019, hue: 30 },
    { title: 'Shoplifters', year: 2018, hue: 8, accent: true },
    { title: 'After the Storm', year: 2016, hue: 220 },
    { title: 'Our Little Sister', year: 2015, hue: 320 },
  ],
  collaborators: [
    { name: 'Sakura Andô', role: 'Actress · 3 films', hue: 320 },
    { name: 'Hiroshi Abe', role: 'Actor · 2 films', hue: 200 },
    { name: 'Lily Franky', role: 'Actor · 4 films', hue: 30 },
  ],
};

function PersonDetailScreen({ theme: t }) {
  return (
    <div style={{
      minHeight: '100%', background: t.bg, color: t.text,
      paddingBottom: 32, position: 'relative', overflow: 'hidden',
    }}>
      {/* Hero band */}
      <div style={{ position: 'relative', height: 340, marginBottom: -40 }}>
        <div style={{
          position: 'absolute', inset: 0,
          background: `linear-gradient(155deg, hsl(${PERSON.hue} 55% 35%) 0%, hsl(${PERSON.hue + 30} 65% 16%) 100%)`,
        }}/>
        <div style={{
          position: 'absolute', inset: 0,
          background: `radial-gradient(ellipse at 50% 30%, hsla(${PERSON.hue} 80% 60% / 0.4), transparent 60%)`,
        }}/>
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0, height: '50%',
          background: `linear-gradient(180deg, transparent, ${t.bg} 92%)`,
        }}/>

        {/* Top nav */}
        <div style={{ position: 'absolute', top: 60, left: 0, right: 0, padding: '0 20px', display: 'flex', justifyContent: 'space-between', zIndex: 5 }}>
          <NavButton theme={t} icon={
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2 L4 7 L9 12" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          }/>
          <div style={{ display: 'flex', gap: 8 }}>
            <NavButton theme={t} icon={
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 1 L11.5 3 L4.5 10 L1.5 11 L2.5 8 Z" stroke="#fff" strokeWidth="1.4" strokeLinejoin="round"/></svg>
            }/>
          </div>
        </div>

        {/* Avatar */}
        <div style={{
          position: 'absolute', top: 110, left: '50%', transform: 'translateX(-50%)',
          width: 120, height: 120, borderRadius: '50%',
          background: `linear-gradient(135deg, hsl(${PERSON.hue} 65% 50%), hsl(${PERSON.hue + 30} 75% 28%))`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 800, fontSize: 38, color: '#fff',
          boxShadow: `0 12px 36px hsla(${PERSON.hue} 70% 40% / 0.5), 0 0 0 4px ${t.bg}`,
          zIndex: 4,
        }}>HK</div>
      </div>

      {/* Name + role */}
      <div style={{ padding: '0 24px 6px', textAlign: 'center', position: 'relative', zIndex: 5 }}>
        <div style={{
          fontWeight: 800, fontSize: 26, letterSpacing: '-0.025em', lineHeight: 1.1,
        }}>{PERSON.name}</div>
        <div style={{
          fontSize: 12, color: t.muted, fontWeight: 700, marginTop: 6,
          letterSpacing: '0.06em', textTransform: 'uppercase',
        }}>{PERSON.role}</div>
      </div>

      {/* Stats strip */}
      <div style={{ padding: '20px 24px 24px' }}>
        <div style={{
          background: t.cardBg, border: t.cardBorder, borderRadius: 16,
          padding: '14px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          boxShadow: t.cardShadow,
        }}>
          {[
            { k: 'Films', v: PERSON.films },
            { k: 'Born', v: '1962' },
            { k: 'From', v: 'Japan' },
          ].map((s, i) => (
            <div key={i} style={{
              textAlign: 'center', flex: 1,
              borderRight: i < 2 ? `1px solid ${t.divider}` : 'none',
            }}>
              <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: '-0.02em' }}>{s.v}</div>
              <div style={{ fontSize: 10.5, color: t.muted, fontWeight: 700, marginTop: 3, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{s.k}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Action */}
      <div style={{ padding: '0 24px 24px', display: 'flex', gap: 8 }}>
        <button style={{
          flex: 1, background: t.text, color: t.bg, border: 'none', padding: '12px 20px',
          borderRadius: 100, fontWeight: 800, fontSize: 13.5, letterSpacing: '-0.01em',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
        }}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5 V11.5 M1.5 6.5 H11.5" stroke={t.bg} strokeWidth="1.8" strokeLinecap="round"/></svg>
          Follow
        </button>
        <button style={{
          background: t.cardBg, color: t.text, border: t.cardBorder,
          padding: '12px 20px', borderRadius: 100, fontWeight: 700, fontSize: 13.5,
        }}>Random pick</button>
      </div>

      {/* Bio */}
      <div style={{ padding: '0 24px 28px' }}>
        <div style={{
          fontSize: 14, color: t.text2, fontWeight: 500, lineHeight: 1.55,
        }}>{PERSON.bio}</div>
      </div>

      {/* Filmography */}
      <div style={{ padding: '0 24px 12px', display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: t.muted, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 4 }}>Filmography</div>
          <div style={{ fontWeight: 800, fontSize: 20, letterSpacing: '-0.025em' }}>{PERSON.films} films · 6 in library</div>
        </div>
        <div style={{ fontSize: 12, color: t.accent, fontWeight: 700 }}>Sort: Year ↓</div>
      </div>

      <div style={{
        padding: '12px 24px 28px', display: 'grid',
        gridTemplateColumns: 'repeat(3, 1fr)', gap: 10,
      }}>
        {PERSON.filmography.map((f, i) => (
          <div key={i}>
            <div style={{ position: 'relative' }}>
              <Poster title={f.title} hue={f.hue} radius={10}/>
              {f.accent && (
                <div style={{
                  position: 'absolute', top: 6, left: 6,
                  padding: '3px 7px', background: '#FFD600',
                  fontSize: 9, fontWeight: 800, color: '#1a1a22',
                  letterSpacing: '0.08em', borderRadius: 5,
                }}>PALME</div>
              )}
            </div>
            <div style={{ marginTop: 8, fontWeight: 700, fontSize: 12, lineHeight: 1.2 }}>{f.title}</div>
            <div style={{ marginTop: 2, fontSize: 10.5, color: t.muted, fontWeight: 600 }}>{f.year}</div>
          </div>
        ))}
      </div>

      {/* Collaborators */}
      <div style={{ padding: '0 24px 12px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: t.muted, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 4 }}>Frequent collaborators</div>
        <div style={{ fontWeight: 800, fontSize: 20, letterSpacing: '-0.025em' }}>Worked with</div>
      </div>
      <div style={{ padding: '12px 24px 28px' }}>
        {PERSON.collaborators.map((c, i) => (
          <div key={i} style={{
            display: 'flex', gap: 12, padding: '10px 0',
            borderBottom: i < PERSON.collaborators.length - 1 ? `1px solid ${t.divider}` : 'none',
            alignItems: 'center',
          }}>
            <div style={{
              flex: '0 0 44px', height: 44, borderRadius: '50%',
              background: `linear-gradient(135deg, hsl(${c.hue} 65% 50%), hsl(${c.hue + 30} 75% 28%))`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontWeight: 800, fontSize: 14, color: '#fff',
            }}>{c.name.split(' ').map(w => w[0]).join('').slice(0, 2)}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</div>
              <div style={{ fontSize: 11, color: t.muted, fontWeight: 600, marginTop: 2 }}>{c.role}</div>
            </div>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2 L8 6 L4 10" stroke={t.muted} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
        ))}
      </div>
    </div>
  );
}

// =============== Root ===============
function App() {
  return (
    <>
      <div className="col">
        <div className="lbl">
          <div className="pill light">LIGHT · MOVIE</div>
          <div className="name">影片详情 · 亮色</div>
          <div className="desc">海报取色 hero + 大字片名 + 评分/genre/tag chips + Play/Save/Share + 简介 + 主创 + 文件信息</div>
        </div>
        <IosFrame bg="#FAF6F0" textColor="#fff" homeBg="rgba(0,0,0,0.35)">
          <MovieDetailScreen theme={LIGHT}/>
        </IosFrame>
      </div>
      <div className="col">
        <div className="lbl">
          <div className="pill dark">DARK · MOVIE</div>
          <div className="name">影片详情 · 暗色</div>
          <div className="desc">同结构。文件路径用 Mono 字体清晰可读。状态栏文字白色与海报背景适配。</div>
        </div>
        <IosFrame bg="#0F0E14" textColor="#fff" homeBg="rgba(255,255,255,0.55)">
          <MovieDetailScreen theme={DARK}/>
        </IosFrame>
      </div>
      <div className="col">
        <div className="lbl">
          <div className="pill light">LIGHT · PERSON</div>
          <div className="name">人物详情 · 亮色</div>
          <div className="desc">大头像 hero + 统计条 (Films/Born/From) + Follow/Random pick + 作品集 3 列网格 (Palme 角标) + 合作者列表</div>
        </div>
        <IosFrame bg="#FAF6F0" textColor="#fff" homeBg="rgba(0,0,0,0.35)">
          <PersonDetailScreen theme={LIGHT}/>
        </IosFrame>
      </div>
      <div className="col">
        <div className="lbl">
          <div className="pill dark">DARK · PERSON</div>
          <div className="name">人物详情 · 暗色</div>
          <div className="desc">作品集 Shoplifters 带金色 PALME 角标 (戛纳金棕榈),不用奖杯 emoji。Worked with 横向 list rows。</div>
        </div>
        <IosFrame bg="#0F0E14" textColor="#fff" homeBg="rgba(255,255,255,0.55)">
          <PersonDetailScreen theme={DARK}/>
        </IosFrame>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
